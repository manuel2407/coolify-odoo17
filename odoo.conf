[options]
; This is the password that allows database operations:
; admin_passwd = admin

; Database settings (will be overridden by environment variables in Coolify)
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = ${DB_NAME}

; Server settings
http_port = 8069
; http_interface = 0.0.0.0

; Logging
log_level = info
log_handler = :INFO
logfile = False

; Workers (adjust based on your server resources)
workers = 0
max_cron_threads = 2

; Security
list_db = True

; Addons path
addons_path = /opt/odoo/addons,/mnt/extra-addons

; Data directory
data_dir = /var/lib/odoo

; Session settings
server_wide_modules = base,`web

; Limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

; CSV import/export settings
csv_internal_sep = ,

; Proxy mode (useful for reverse proxies)
proxy_mode = True

; Disable auto-reload in production
dev_mode = False

; Email configuration (configure via environment variables in Coolify)
; email_from = ${EMAIL_FROM}
; smtp_server = ${SMTP_SERVER}
; smtp_port = ${SMTP_PORT}
; smtp_ssl = ${SMTP_SSL}
; smtp_user = ${SMTP_USER}
; smtp_password = ${SMTP_PASSWORD}

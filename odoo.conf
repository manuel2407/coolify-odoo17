[options]
; Master password for database operations (set ADMIN_PASSWD in Coolify)
admin_passwd = ${ADMIN_PASSWD}

; Database connection (env-driven)
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = ${DB_NAME}

; Server
http_port = 8069
proxy_mode = True
dev_mode = False

; Logging to stdout (container-friendly)
log_level = info
logfile = False

; Single-database mode: do not list other databases
list_db = False
dbfilter = ^${DB_NAME}$

; Paths
data_dir = /var/lib/odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
server_wide_modules = base,web

; Processes (tune with WORKERS / MAX_CRON_THREADS if you render them later)
workers = 0
max_cron_threads = 2

; Resource limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

[options]
; This is the password that allows database operations:
; admin_passwd = admin

; Database settings (will be overridden by environment variables)
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = ${DB_NAME}

; Server settings
http_port = 8069

; Logging
log_level = info
logfile = False

; Workers (adjust based on your server resources)
workers = 0
max_cron_threads = 2

; Security
list_db = True

; Data directory
data_dir = /var/lib/odoo

; Session settings
server_wide_modules = base,web

; Database filter (only allow configured database)
dbfilter = ^${DB_NAME}$

; Limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

; Proxy mode (useful for reverse proxies like Coolify)
proxy_mode = True

; Disable auto-reload in production
dev_mode = False
version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-odoo}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # PostgreSQL stays on the internal Docker network only.
    # For local debugging you can temporarily expose it:
    # ports:
    #   - "5432:5432"

  odoo:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      # Coolify: generates/assigns a public domain and proxies to container port 8069
      SERVICE_URL_ODOO_8069: /
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-odoo}
      DB_PASSWORD: ${DB_PASSWORD:-odoo_password}
      DB_NAME: ${DB_NAME:-odoo}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-changeme}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-data:
  db-data:
